name: tests

on:
  push:
  pull_request:

# Cancel an in-flight run when a newer commit on the same ref is pushed — faster
# feedback on the latest commit, fewer wasted runner minutes (#74).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip                       # cache wheels keyed on the requirements files
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # Core runtime (requirements.txt) + test/dev deps (requirements-dev.txt:
        # pytest, ruff, fastapi, cryptography, matplotlib) — one source of truth.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (real-bug categories only)
        # F = pyflakes (undefined names, unused imports, redefinitions, repeated
        # dict keys), E9 = syntax errors, B = bugbear (mutable default args, zip
        # without strict, etc.). Not style — these catch genuine bugs like a
        # duplicate test method that silently never runs.
        run: python -m ruff check --select F,E9,B .
      - name: Run test suite
        # The suite is hermetic (conftest excludes the live smoke_test, #18) and the
        # v2 fixture is committed (#19), so no network or secrets are needed.
        run: python -m pytest -q
